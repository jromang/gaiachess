[package]
name = "gaiachess"
version = "4.2.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/jromang/gaiachess"

[features]
default = ["syzygy", "gaiatb", "online-tb", "nalimov"]
nnue = []
spsa = []
syzygy = []
gaiatb = ["dep:zstd"]
nalimov = ["dep:nalimov-tb"]
online-tb = ["dep:ureq", "dep:serde", "dep:serde_json"]
datagen = ["dep:time", "dep:ctrlc", "dep:viriformat"]

[dependencies]
bpaf = { version = "0.9", features = ["derive"] }
ctrlc = { version = "3.5.2", optional = true }
time = { version = "0.3", features = ["local-offset"], optional = true }
zstd = { version = "0.13", optional = true }
ureq = { version = "3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
nalimov-tb = { version = "0.2", optional = true, package = "nalimov" }
viriformat = { version = "2.0", optional = true }
indicatif = "0.18"
ruzstd = "0.8"

[build-dependencies]
zstd = "0.13"
cc = "1.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[profile.dev]
opt-level = 3
