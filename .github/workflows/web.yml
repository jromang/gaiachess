
# Builds the browser package and proves it works.
#
# The release workflow attaches the zip to the GitHub release (and itch.io). This one
# only builds and checks: it does not upload an Actions artefact, those counted against
# the account storage quota. Nothing in this chain fails loudly: a mis-declared import
# becomes a stub that quietly does nothing, and a stale file ships without anyone noticing.
#
# It can also be started by hand from the Actions tab, which is how you try a change to
# the recipe itself.

name: Web

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"

      - name: Build the package
        run: bash tools/web/build.sh --zip

      # The one check no browser is needed for, and the one that matters most: the module
      # is made to actually search, with the weights it ships beside.
      - name: Check the engine module plays a move
        run: |
          python3 -c "import zlib, sys; sys.stdout.buffer.write(zlib.decompress(open('web/dist/net.bin.deflate', 'rb').read(), -15))" > /tmp/net.bin
          cat > /tmp/session.uci <<'SESSION'
          uci
          isready
          position startpos
          go depth 12
          quit
          SESSION
          node web/engine/host.mjs web/dist/engine.wasm --net /tmp/net.bin < /tmp/session.uci > /tmp/out.txt
          tail -3 /tmp/out.txt
          grep -qE '^bestmove [a-h][1-8][a-h][1-8]' /tmp/out.txt || {
            echo 'the engine module named no move'
            exit 1
          }

      - name: Check the archive
        run: python3 tools/web/check-zip.py var/web/gaiachess-web.zip
