name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ================================================================
  # Job 0: Create GitHub release (empty, other jobs upload binaries)
  # ================================================================
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          gh release create "$TAG" \
            --title "GaiaChess $VERSION" \
            --notes "$(cat <<'NOTES'
          ## Download

          One binary per platform. **Windows** binaries end in `.exe`, **Linux** and **macOS** have no extension.
          On x86-64 the engine selects its SIMD paths at startup from your CPU — AVX2 up to AVX-512+VNNI for the
          neural network, PEXT or AVX2 for move generation — so there is nothing to choose.

          | Binary | Platform | Runs on |
          |--------|----------|---------|
          | `universal` | Windows / Linux x86-64 | Any CPU from ~2013 (Intel Haswell+, AMD Zen+) |
          | `compat` | Windows / Linux x86-64 | Any x86-64 CPU (2003+) |
          | `console` | Windows x86-64 | ChessBase GUIs (Fritz, ChessBase...) — same engine as `universal`, without the built-in board |
          | `neon` | Linux ARM64 | RPi 4+, Graviton... |
          | `android-neon` | Android ARM64 | Android chess GUIs (DroidFish...), Termux |
          | `apple-silicon` | macOS | M1 and later |

          Take **`universal`**. Take `compat` only if `universal` does not start (a CPU older
          than ~2013): it is the same engine on portable code paths — slower search, and a
          scalar network below AVX2 — but it plays the same chess.

          **ChessBase GUIs (Fritz, ChessBase) cannot load `universal`**: their engine
          installer only accepts console applications, and `universal` carries the built-in
          board. Register **`console`** there instead — the same engine and strength, just
          without the board.

          `gaiachess info` prints which paths were selected on your machine. The environment
          variables `GAIA_SIMD=scalar|avx2|avx512|vnni512` and `GAIA_PEXT=0|1` cap the
          selection, for benchmarking or troubleshooting.

          ### Running on Linux

          The binary is both the engine and the board: started on its own it opens the
          interface, and a chess GUI that speaks UCI to it gets the engine instead.
          Because it carries the interface's sound, **Linux binaries need `libasound2`**
          (`alsa-lib` on Arch) — present on any desktop, sometimes missing from minimal
          server images and containers. Windows and macOS need nothing extra.

          `android-neon` is the exception: engine only (no board, no sound), statically
          linked against musl, so it needs nothing at all — point your Android chess
          GUI at the file and it runs.

          All x86-64 binaries are compiled with **PGO** (Profile-Guided Optimization); every
          SIMD tier the binary can select is profiled, the AVX-512 ones under Intel SDE.
          The neural network is embedded — no external file needed.

          ### Play in a browser

          The whole game is a web page too, with nothing to install:
          **https://jromang.itch.io/gaiachess**

          `gaiachess-web.zip` is that page, for anyone who would rather serve it from
          their own static host. Two things it wants: an embed of **528x630** (three times
          the artwork, so nothing is scaled), and cross-origin isolation —
          `COOP`/`COEP` headers — without which a search can only be abandoned, never
          cut short.
          NOTES
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 1: Linux x86-64 (universal + compat, runtime dispatch, PGO)
  # ================================================================
  linux-x86:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # libasound2-dev: the board ships as a default feature, and its sound pulls
      # alsa-sys, whose build script asks pkg-config for the ALSA headers.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libasound2-dev

      # PGO has to RUN the instrumented binary to collect profiles, and GitHub
      # cannot guarantee an AVX-512 runner (actions/runner-images#3389). The pool
      # is a per-job lottery — EPYC 7763 has no AVX-512, EPYC 9V74 has it masked
      # out of CPUID by Azure — so without emulation the AVX-512 binaries ship
      # with or without PGO at random. Intel SDE removes the lottery (standard
      # practice for AVX-512 CI). Pinned to a SHA: third-party action, release path.
      - name: Setup Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          echo "net=$NET" >> "$GITHUB_ENV"
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all x86-64 variants (PGO)
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          ./tools/pgo/build-release.sh --linux-only
        env:
          # Fail the build rather than silently publish a non-PGO AVX-512 binary.
          PGO_SDE: require

      # One SIMD tier must count the same bench nodes from either binary, and
      # the attack-path election must not change the tree — anything else is a
      # dispatch or weight-permutation bug about to ship as a wrong evaluation.
      - name: Verify runtime dispatch
        run: ./tools/pgo/verify-dispatch.sh output/gaiachess-linux-universal output/gaiachess-linux-compat
        env:
          PGO_SDE: require

      - name: Upload binaries to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Uploading Linux x86-64 binaries ==="
          ls -lh output/
          gh release upload "$TAG" output/gaiachess-linux-* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 2: Windows x86-64 (NATIVE build on a Windows runner, PGO)
  # ================================================================
  # This job used to cross-compile from Linux, profiling a native Linux build
  # and feeding those profiles to the Windows binary. That never worked: Rust
  # mangled names embed a crate hash derived from -C metadata, which includes
  # the target triple, so the profiles matched nothing and -Cprofile-use was a
  # silent no-op. (Measured: same 86 function paths on both sides, zero overlap
  # — gaiachess::see::see is ..17hb1bdbe35..E on Linux, ..17hb7dc437a..E on
  # Windows.) The assumption holds in C++ (where cross-profiling is common),
  # but not in Rust. Windows must profile itself.
  windows-x86:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # MSVC, not mingw: -Cprofile-generate needs the profiler_builtins
          # crate, and the x86_64-pc-windows-gnu rust-std does not ship it
          # ("can't find crate for `profiler_builtins`"), so the gnu target
          # cannot be PGO-built at all. build-common.sh adds +crt-static so the
          # .exe stays self-contained, with no VC++ redistributable to install.
          components: llvm-tools-preview

      - name: Add clang to PATH
        run: |
          # build.rs compiles src/pyrrhic/tbprobe.c with clang.
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - name: Setup Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1

      - name: Verify toolchain
        run: |
          gcc --version | head -1
          clang --version | head -1
          rustc -vV | sed -n 's/^host: /rustc host: /p'
          ls "$SDE_PATH"

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          echo "net=$NET" >> "$GITHUB_ENV"
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all x86-64 variants for Windows (native PGO)
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          # Keep the profile directory free of spaces: the flags are joined with
          # spaces into CARGO_TARGET_<TRIPLE>_RUSTFLAGS, which cargo re-splits.
          export PGO_DIR="$GITHUB_WORKSPACE/pgo-data"
          ./tools/pgo/build-release.sh --windows-only
        env:
          # Fail the build rather than silently publish a non-PGO AVX-512 binary.
          PGO_SDE: require

      - name: Verify runtime dispatch
        run: ./tools/pgo/verify-dispatch.sh output/gaiachess-windows-universal.exe output/gaiachess-windows-compat.exe
        env:
          PGO_SDE: require

      - name: Upload binaries to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Uploading Windows x86-64 binaries ==="
          ls -lh output/
          gh release upload "$TAG" output/gaiachess-windows-*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 3: Linux ARM64 (cross-compile, no PGO)
  # ================================================================
  linux-arm:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # The board ships by default and its sound links against ALSA, so the arm64
      # headers are needed here too. They are not on the default mirrors, which
      # carry amd64 only -- arm64 lives on ports.ubuntu.com. So the existing
      # entries are pinned to amd64, otherwise apt 404s on them for arm64, and the
      # ports mirror is added beside them. libasound2-dev is Multi-Arch: same, so
      # the two architectures coexist.
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -f "$KEYRING"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb \(http\)/deb [arch=amd64] \1/' /etc/apt/sources.list
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null <<PORTS
          deb [arch=arm64 signed-by=$KEYRING] http://ports.ubuntu.com/ubuntu-ports $CODENAME main universe
          deb [arch=arm64 signed-by=$KEYRING] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main universe
          PORTS
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu libasound2-dev:arm64
          # Fail here, not three minutes later with an unreadable link error.
          test -f /usr/lib/aarch64-linux-gnu/pkgconfig/alsa.pc

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          echo "net=$NET" >> "$GITHUB_ENV"
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 (no PGO)
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          ./tools/pgo/build-release-arm.sh
        env:
          # pkg-config will not answer for another architecture unless told to, and
          # would otherwise hand the build the amd64 ALSA. LIBDIR replaces the
          # default search path outright, so no host .pc can slip in. Set here and
          # not in the build script: these paths are Debian multiarch, and the
          # script also runs on other distributions.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /

      - name: Upload binary to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Uploading Linux ARM64 binary ==="
          ls -lh output/
          gh release upload "$TAG" output/gaiachess-linux-neon --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 3b: Android ARM64 (static musl cross-compile, engine only, no PGO)
  # ================================================================
  # Android's libc is Bionic: the glibc-linked neon binary above does not start
  # there. This one is statically linked against musl — it depends on the kernel
  # alone, so any arm64 Android chess GUI (DroidFish, Chess for Android...) can
  # run it. Built headless (--no-default-features): no board, no ALSA.
  android-arm:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # clang compiles Pyrrhic (build.rs), qemu runs the smoke test below.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang qemu-user-static

      # Bootlin toolchains have versioned, immutable URLs — pinned by SHA256,
      # like the SDE action and butler: the compiler that ships a release should
      # change because someone chose it, not because a day passed.
      - name: Install musl cross-toolchain
        run: |
          TC=aarch64--musl--stable-2025.08-1
          SHA=defba831ffa1175236f137069333e21ed46d4d19feb5080a90cf248b6fc2cb08
          curl --fail --retry 3 -sL -o "/tmp/$TC.tar.xz" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/$TC.tar.xz"
          echo "$SHA  /tmp/$TC.tar.xz" | sha256sum -c -
          tar xf "/tmp/$TC.tar.xz" -C "$HOME"
          echo "$HOME/$TC/bin" >> "$GITHUB_PATH"

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          echo "net=$NET" >> "$GITHUB_ENV"
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 musl static (no PGO)
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          ./tools/pgo/build-release-arm-musl.sh

      # The x86 runner can execute the static arm64 binary under qemu: make it
      # actually play before shipping — a cross-build fault would be silent
      # otherwise, and nobody on the team runs Android.
      - name: Check the binary plays a move
        run: |
          printf 'uci\nisready\nposition startpos\ngo depth 8\nquit\n' \
            | qemu-aarch64-static output/gaiachess-android-neon > /tmp/out.txt
          tail -3 /tmp/out.txt
          grep -qE '^bestmove [a-h][1-8][a-h][1-8]' /tmp/out.txt || {
            echo 'the engine named no move'
            exit 1
          }

      - name: Upload binary to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Uploading Android ARM64 binary ==="
          ls -lh output/
          gh release upload "$TAG" output/gaiachess-android-neon --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 4: macOS Apple Silicon (native build, no PGO)
  # ================================================================
  macos-arm:
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          echo "net=$NET" >> "$GITHUB_ENV"
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS Apple Silicon (no PGO)
        run: |
          NET="${{ env.net }}"
          FEATURES="nnue,syzygy,nalimov,gaiatb,online-tb"

          # PGO disabled on macOS: build.rs SIGSEGV under PGO instrumentation
          MODEL="$NET" RUSTFLAGS="-C target-cpu=apple-m1" \
            cargo build --release --features "$FEATURES"

          mkdir -p output
          cp target/release/gaiachess output/gaiachess-macos-apple-silicon

      - name: Upload binary to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== Uploading macOS Apple Silicon binary ==="
          ls -lh output/
          gh release upload "$TAG" output/gaiachess-macos-apple-silicon --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 5: WebAssembly package, ready to upload to itch.io
  # ================================================================
  web:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Download net
        run: |
          NET=$(grep '^DEFAULT_NET=' defaults.conf | head -1 | sed 's/DEFAULT_NET=//;s/"//g')
          mkdir -p $(dirname "$NET")
          curl --fail --retry 3 -L -o "$NET" "https://huggingface.co/jromanghf/gaiachess-networks/resolve/main/$(basename $NET)"

      - name: Build the package
        run: bash tools/web/build.sh --zip

      # The browser build has no test suite of its own, and every fault in it is silent:
      # a mis-declared import becomes a stub that quietly does nothing. So the engine
      # module is made to actually play here, under Node, with the weights it ships
      # beside — which needs no browser.
      - name: Check the engine module plays a move
        run: |
          python3 -c "import zlib, sys; sys.stdout.buffer.write(zlib.decompress(open('web/dist/net.bin.deflate', 'rb').read(), -15))" > /tmp/net.bin
          cat > /tmp/session.uci <<'SESSION'
          uci
          isready
          position startpos
          go depth 12
          position fen 7k/8/8/8/8/8/8/KQ6 w - - 0 1
          go depth 1
          quit
          SESSION
          node web/engine/host.mjs web/dist/engine.wasm --net /tmp/net.bin --tb web/dist/tb34.gtpk < /tmp/session.uci > /tmp/out.txt
          tail -3 /tmp/out.txt
          grep -qE '^bestmove [a-h][1-8][a-h][1-8]' /tmp/out.txt || {
            echo 'the engine module named no move'
            exit 1
          }
          # A mate-in-8 at depth 1 can only come out of the tablebases: the search
          # cannot see that far, so this is the probe path exercised end to end.
          grep -q 'score mate 8' /tmp/out.txt || {
            echo 'the endgame tables answered no probe'
            exit 1
          }

      - name: Check the archive
        run: python3 tools/web/check-zip.py var/web/gaiachess-web.zip

      - name: Upload to release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ls -lh var/web/
          gh release upload "$TAG" var/web/gaiachess-web.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 6: publish to itch.io — the page to play on, and three downloads
  # ================================================================
  # Last, and behind every build job: itch.io is where people arrive, and a page that
  # offers three platforms of which one is missing is worse than a page that waits. The
  # binaries are taken from the release rather than rebuilt, so what itch serves is the
  # same file as the one under the tag, byte for byte.
  itch:
    needs: [create-release, linux-x86, windows-x86, macos-arm, web]
    # Only the public repository publishes. A v* tag pushed anywhere else builds
    # everything and touches nothing on itch.io.
    if: github.repository == 'jromang/gaiachess'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than LATEST, like the SDE action above: the version that publishes
      # should change because someone chose it, not because a day passed.
      - name: Install butler
        run: |
          curl --fail --retry 3 -L -o /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/15.30.0/archive/default
          unzip -q -o /tmp/butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Verify butler
        run: butler -V

      - name: Push to itch.io
        run: bash tools/itch/push.sh "${GITHUB_REF#refs/tags/}"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
