[package]
name = "gaia-web-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The interface is deliberately absent: this module is the search and nothing else, and
# the two halves of the browser build are separate modules precisely so that neither
# carries the other's dependencies.
# `gaiatb` carries no blob here — build.rs embeds nothing on wasm — only the probing
# code; the tables travel beside the module and arrive through gaia_tb_reserve/finish.
gaiachess = { path = "../..", default-features = false, features = ["nnue", "gaiatb"] }
